[project]
name = "graphview-worker"
version = "0.0.0"
description = "Future async ingestion worker for Graphview."
requires-python = ">=3.14"
dependencies = [
  "arq>=0.28.0,<0.29.0",
  "graphview-api",
  "pydantic-settings",
  "pypdf"
]

[build-system]
requires = ["hatchling>=1.28.0,<2.0.0"]
build-backend = "hatchling.build"

[tool.uv.sources]
graphview-api = { workspace = true }

[dependency-groups]
dev = [
  "pytest"
]
