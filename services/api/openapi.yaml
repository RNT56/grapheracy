openapi: 3.1.0
info:
  title: Graphview API
  version: 0.4.0
  description: Runnable Graphview API contract for graph, source, ingestion, proposal, review, and import/export flows.
paths:
  /health:
    get:
      summary: Service health check.
      responses:
        "200":
          description: API process is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /version:
    get:
      summary: Service version and build metadata.
      responses:
        "200":
          description: Version metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
  /graph:
    get:
      summary: List or query graph projects, nodes, and edges.
      responses:
        "200":
          description: Graph data response.
  /sources:
    get:
      summary: List sources for the active project.
      responses:
        "200":
          description: Source list response.
    post:
      summary: Create a source for the active project.
      responses:
        "201":
          description: Created source.
  /sources/{source_id}:
    patch:
      summary: Update a source.
      parameters:
        - name: source_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated source.
    delete:
      summary: Delete a source.
      parameters:
        - name: source_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted source.
  /ingestion-runs:
    get:
      summary: List ingestion runs and current stages.
      responses:
        "200":
          description: Ingestion run list response.
    post:
      summary: Ingest text, markdown, URL, or PDF content and create reviewable proposals.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestionCreate"
      responses:
        "201":
          description: Created source, ingestion run, proposals, and embeddings.
        "422":
          description: Missing required source content.
        "502":
          description: Source fetch or extraction failed.
  /proposals:
    get:
      summary: List extraction proposals awaiting or carrying review decisions.
      responses:
        "200":
          description: Proposal list response.
    post:
      summary: Create an extraction proposal from a source.
      responses:
        "201":
          description: Created proposal.
  /review-decisions:
    get:
      summary: List review decisions.
      responses:
        "200":
          description: Review decision list response.
    post:
      summary: Review a proposal and commit accepted graph changes.
      responses:
        "201":
          description: Created review decision.
  /search:
    get:
      summary: Search sources and graph nodes.
      responses:
        "200":
          description: Search results.
  /export:
    get:
      summary: Export the active project graph bundle.
      responses:
        "200":
          description: Export bundle.
  /import:
    post:
      summary: Import sources and proposal seeds.
      responses:
        "200":
          description: Imported bundle.
components:
  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
    VersionResponse:
      type: object
      required: [service, version, environment]
      properties:
        service:
          type: string
        version:
          type: string
        environment:
          type: string
    IngestionCreate:
      type: object
      required: [kind, title]
      properties:
        kind:
          type: string
          enum: [text, markdown, url, pdf]
        title:
          type: string
        content:
          type: string
        uri:
          type: string
        content_base64:
          type: string
        proposal_limit:
          type: integer
          minimum: 1
          maximum: 12
          default: 4
