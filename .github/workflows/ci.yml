name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.18"
      - uses: pnpm/action-setup@v5
        with:
          version: 10.27.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run changelog:check
      - run: pnpm run security:local
      - run: pnpm run security:licenses
      - run: uv python install 3.14.5
      - run: pnpm run architecture:check
      - run: pnpm run api:check
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm --filter @graphview/web build
      - run: pnpm run test:performance

  browser:
    name: Live browser acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: { version: "0.11.18" }
      - uses: pnpm/action-setup@v5
        with: { version: 10.27.0 }
      - uses: actions/setup-node@v6
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: uv python install 3.14.5
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:smoke
      - run: pnpm run test:e2e
        env: { PLAYWRIGHT_WORKERS: "2" }

  migrations:
    name: PostgreSQL migration rehearsal
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: graphview
          POSTGRES_USER: graphview
          POSTGRES_PASSWORD: graphview-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U graphview -d graphview"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: { version: "0.11.18" }
      - run: uv python install 3.14.5
      - run: uv sync --all-packages --all-groups --frozen
      - run: bash scripts/test-postgres-migrations.sh
        env:
          GRAPHVIEW_DATABASE_URL: postgresql+psycopg://graphview:graphview-ci@127.0.0.1:5432/graphview
