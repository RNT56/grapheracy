name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release-images:
    name: Build, attest, and sign (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { service: api, dockerfile: infra/docker/api.Dockerfile }
          - { service: web, dockerfile: infra/docker/web.Dockerfile }
          - { service: worker, dockerfile: infra/docker/worker.Dockerfile }
          - { service: otel, dockerfile: infra/docker/otel-collector.Dockerfile }
          - { service: ops, dockerfile: infra/docker/ops.Dockerfile }
          - { service: keycloak, dockerfile: infra/docker/keycloak.Dockerfile }
          - { service: clamav, dockerfile: infra/docker/clamav.Dockerfile }
          - { service: minio, dockerfile: infra/docker/minio.Dockerfile }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          sbom: true
          provenance: mode=max
          tags: ghcr.io/${{ github.repository_owner }}/graphview-${{ matrix.service }}:${{ github.ref_name }}
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/graphview-${{ matrix.service }}@${{ steps.build.outputs.digest }}
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/graphview-${{ matrix.service }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record immutable image digest
        run: jq -n --arg service "${{ matrix.service }}" --arg image "ghcr.io/${{ github.repository_owner }}/graphview-${{ matrix.service }}" --arg digest "${{ steps.build.outputs.digest }}" '{service:$service,image:$image,digest:$digest}' > "image-${{ matrix.service }}.json"
      - uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ matrix.service }}
          path: image-${{ matrix.service }}.json
          if-no-files-found: error
          retention-days: 7

  client-artifacts:
    name: Package gateway and editor extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with: { version: 10.27.0 }
      - uses: actions/setup-node@v6
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @graphview/agent-gateway test && pnpm --filter @graphview/vscode-extension test
      - run: pnpm run release:artifacts && pnpm run release:artifacts:verify
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/release/*
      - uses: actions/upload-artifact@v7
        with:
          name: graphview-client-artifacts
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: Verify tag and publish signed release manifest
    needs: [release-images, client-artifacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v5
        with: { version: 10.27.0 }
      - uses: actions/setup-node@v6
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: graphview-client-artifacts
          path: dist/release
      - uses: actions/download-artifact@v8
        with:
          pattern: image-digest-*
          path: dist/images
          merge-multiple: true
      - name: Verify the annotated tag signature
        run: |
          object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")"
          test "$(jq -r .object.type <<<"$object")" = tag
          tag_sha="$(jq -r .object.sha <<<"$object")"
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.verification.verified' | grep -Fx true
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - run: pnpm run release:artifacts:verify
      - name: Assemble immutable image manifest
        run: |
          jq -s --arg release "$GITHUB_REF_NAME" '{schema_version:1,release:$release,images:(sort_by(.service))}' dist/images/*.json > dist/release/image-manifest.json
          (cd dist/release && sha256sum image-manifest.json >> SHA256SUMS)
      - uses: sigstore/cosign-installer@v3
      - name: Sign the complete release checksum manifest
        run: cosign sign-blob --yes --bundle dist/release/SHA256SUMS.sigstore.json dist/release/SHA256SUMS
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/release/*
      - run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes dist/release/*
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
