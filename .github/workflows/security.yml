name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  dependency-audit:
    name: Dependency audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.18"
      - uses: pnpm/action-setup@v5
        with:
          version: 10.27.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run security:audit
      - run: pnpm run security:signatures
      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            scan source -r .
      - run: uv python install 3.14.5
      - name: Python dependency audit
        run: uv export --project services/api --format requirements-txt --output-file /tmp/api-requirements.txt && uv export --project services/worker --format requirements-txt --output-file /tmp/worker-requirements.txt

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image-security:
    name: Image SBOM and vulnerability scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: api, dockerfile: infra/docker/api.Dockerfile }
          - { service: web, dockerfile: infra/docker/web.Dockerfile }
          - { service: worker, dockerfile: infra/docker/worker.Dockerfile }
          - { service: otel, dockerfile: infra/docker/otel-collector.Dockerfile }
          - { service: ops, dockerfile: infra/docker/ops.Dockerfile }
          - { service: keycloak, dockerfile: infra/docker/keycloak.Dockerfile }
          - { service: clamav, dockerfile: infra/docker/clamav.Dockerfile }
          - { service: minio, dockerfile: infra/docker/minio.Dockerfile }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: graphview-${{ matrix.service }}:security-scan
      - uses: anchore/sbom-action@v0
        with:
          image: graphview-${{ matrix.service }}:security-scan
          artifact-name: graphview-${{ matrix.service }}.spdx.json
          format: spdx-json
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: graphview-${{ matrix.service }}:security-scan
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
