name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  dependency-audit:
    name: Dependency audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.18"
      - uses: pnpm/action-setup@v5
        with:
          version: 10.27.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run security:audit
      - run: pnpm run security:signatures
      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v3
        with:
          scan-args: |-
            scan source -r .
      - run: uv python install 3.14.5
      - name: Python dependency audit
        run: uv export --project services/api --format requirements-txt --output-file /tmp/api-requirements.txt && uv export --project services/worker --format requirements-txt --output-file /tmp/worker-requirements.txt

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: gitleaks/gitleaks-action@v3

  sbom-plan:
    name: SBOM generation plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: SBOM placeholder
        run: echo "Release image SBOM generation begins when app/API/worker images become runnable."
