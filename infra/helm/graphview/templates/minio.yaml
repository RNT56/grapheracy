{{- if .Values.minio.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-minio
  labels: { app.kubernetes.io/name: graphview-minio, app.kubernetes.io/instance: {{ .Release.Name }} }
spec:
  selector: { app.kubernetes.io/name: graphview-minio, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports:
    - { name: api, port: 9000, targetPort: api }
    - { name: console, port: 9001, targetPort: console }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-minio
  labels: { app.kubernetes.io/name: graphview-minio, app.kubernetes.io/instance: {{ .Release.Name }} }
spec:
  serviceName: {{ .Release.Name }}-minio
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: graphview-minio, app.kubernetes.io/instance: {{ .Release.Name }} } }
  template:
    metadata: { labels: { app.kubernetes.io/name: graphview-minio, app.kubernetes.io/part-of: graphview, app.kubernetes.io/instance: {{ .Release.Name }} } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: minio
          image: {{ .Values.minio.image | quote }}
          args: [server, /graphview-data, --console-address, ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: {{ .Values.minio.auth.existingSecret }}, key: {{ .Values.minio.auth.rootUserKey }} } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.minio.auth.existingSecret }}, key: {{ .Values.minio.auth.rootPasswordKey }} } }
            - { name: HOME, value: /tmp }
          ports: [{ name: api, containerPort: 9000 }, { name: console, containerPort: 9001 }]
          readinessProbe: { httpGet: { path: /minio/health/ready, port: api }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /minio/health/live, port: api }, initialDelaySeconds: 20, periodSeconds: 20 }
          resources: {{ toYaml .Values.minio.resources | nindent 12 }}
          securityContext: { runAsNonRoot: true, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: data, mountPath: /graphview-data }, { name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 1Gi } }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.minio.persistence.storageClassName }}
        storageClassName: {{ .Values.minio.persistence.storageClassName | quote }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.minio.persistence.size | quote }} } }
{{- end }}
