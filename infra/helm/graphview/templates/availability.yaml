{{- range $name := list "web" "api" "worker" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: {{ $.Release.Name }}-{{ $name }} }
spec:
  minAvailable: 1
  selector: { matchLabels: { app.kubernetes.io/name: graphview-{{ $name }} } }
{{- end }}
{{- if .Values.autoscaling.enabled }}
{{- range $name := list "api" "worker" }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: {{ $.Release.Name }}-{{ $name }} }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ $.Release.Name }}-{{ $name }} }
  minReplicas: {{ (index $.Values.autoscaling $name).minReplicas }}
  maxReplicas: {{ (index $.Values.autoscaling $name).maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ (index $.Values.autoscaling $name).targetCPUUtilizationPercentage }} }
{{- end }}
{{- end }}
