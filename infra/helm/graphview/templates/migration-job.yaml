apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate-{{ .Release.Revision }}
  labels:
    app.kubernetes.io/name: graphview-migrate
    app.kubernetes.io/part-of: graphview
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata: { labels: { app.kubernetes.io/name: graphview-migrate, app.kubernetes.io/part-of: graphview, app.kubernetes.io/instance: {{ .Release.Name }} } }
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      initContainers:
        - name: wait-for-postgresql
          image: {{ .Values.database.image | quote }}
          command: [/bin/sh, -ec]
          args: ['until pg_isready; do sleep 2; done']
          env:
            - { name: PGHOST, value: {{ printf "%s-postgresql" .Release.Name | quote }} }
            - { name: PGUSER, value: {{ .Values.database.auth.username | quote }} }
            - { name: PGDATABASE, value: {{ .Values.database.auth.database | quote }} }
          securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 25m, memory: 64Mi }, limits: { cpu: 250m, memory: 256Mi } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      containers:
        - name: migrate
          image: {{ .Values.image.api | quote }}
          command: [alembic, -c, services/api/alembic.ini, upgrade, head]
          envFrom:
            - configMapRef: { name: {{ .Release.Name }}-config }
            - secretRef: { name: {{ .Values.runtimeSecretName }} }
          env:
{{ include "graphview.runtimeEnv" . | nindent 12 }}
          securityContext: { runAsNonRoot: true, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: {{ toYaml .Values.migration.resources | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
