{{- if .Values.clamav.enabled }}
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-clamav, labels: { app.kubernetes.io/name: graphview-clamav, app.kubernetes.io/instance: {{ .Release.Name }} } }
spec:
  selector: { app.kubernetes.io/name: graphview-clamav, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: clamd, port: 3310, targetPort: clamd }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: {{ .Release.Name }}-clamav, labels: { app.kubernetes.io/name: graphview-clamav, app.kubernetes.io/instance: {{ .Release.Name }} } }
spec:
  serviceName: {{ .Release.Name }}-clamav
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: graphview-clamav, app.kubernetes.io/instance: {{ .Release.Name }} } }
  template:
    metadata: { labels: { app.kubernetes.io/name: graphview-clamav, app.kubernetes.io/part-of: graphview, app.kubernetes.io/instance: {{ .Release.Name }} } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 100, runAsGroup: 101, fsGroup: 101, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: clamav
          image: {{ .Values.clamav.image | quote }}
          ports: [{ name: clamd, containerPort: 3310 }]
          readinessProbe: { tcpSocket: { port: clamd }, initialDelaySeconds: 20, periodSeconds: 10, failureThreshold: 30 }
          livenessProbe: { tcpSocket: { port: clamd }, initialDelaySeconds: 90, periodSeconds: 30 }
          resources: {{ toYaml .Values.clamav.resources | nindent 12 }}
          securityContext: { runAsNonRoot: true, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: database, mountPath: /var/lib/clamav }, { name: runtime, mountPath: /run/clamav }, { name: tmp, mountPath: /tmp }]
      volumes: [{ name: runtime, emptyDir: {} }, { name: tmp, emptyDir: { sizeLimit: 1Gi } }]
  volumeClaimTemplates:
    - metadata: { name: database }
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.clamav.persistence.storageClassName }}
        storageClassName: {{ .Values.clamav.persistence.storageClassName | quote }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.clamav.persistence.size | quote }} } }
{{- end }}
