{{- if .Values.database.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgresql
  labels: { app.kubernetes.io/name: graphview-postgresql, app.kubernetes.io/part-of: graphview, app.kubernetes.io/instance: {{ .Release.Name }} }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: graphview-postgresql, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgresql
  labels: { app.kubernetes.io/name: graphview-postgresql, app.kubernetes.io/part-of: graphview, app.kubernetes.io/instance: {{ .Release.Name }} }
spec:
  serviceName: {{ .Release.Name }}-postgresql
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: graphview-postgresql, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: graphview-postgresql, app.kubernetes.io/part-of: graphview, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: postgresql
          image: {{ .Values.database.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext: { runAsNonRoot: true, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          env:
            - { name: POSTGRES_USER, value: {{ .Values.database.auth.username | quote }} }
            - { name: POSTGRES_DB, value: {{ .Values.database.auth.database | quote }} }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.database.auth.existingSecret }}, key: {{ .Values.database.auth.passwordKey }} } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ name: postgres, containerPort: 5432 }]
          readinessProbe: { exec: { command: [pg_isready, -U, {{ .Values.database.auth.username | quote }}, -d, {{ .Values.database.auth.database | quote }}] }, initialDelaySeconds: 10, periodSeconds: 10 }
          livenessProbe: { exec: { command: [pg_isready, -U, {{ .Values.database.auth.username | quote }}, -d, {{ .Values.database.auth.database | quote }}] }, initialDelaySeconds: 30, periodSeconds: 20 }
          resources: { requests: { cpu: 500m, memory: 1Gi }, limits: { cpu: "4", memory: 8Gi } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }, { name: runtime, mountPath: /var/run/postgresql }, { name: tmp, mountPath: /tmp }]
      volumes: [{ name: runtime, emptyDir: {} }, { name: tmp, emptyDir: {} }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.database.persistence.storageClassName }}
        storageClassName: {{ .Values.database.persistence.storageClassName | quote }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.database.persistence.size | quote }} } }
{{- end }}
