{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-redis-master, labels: { app.kubernetes.io/name: graphview-redis, app.kubernetes.io/instance: {{ .Release.Name }} } }
spec:
  selector: { app.kubernetes.io/name: graphview-redis, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: {{ .Release.Name }}-redis, labels: { app.kubernetes.io/name: graphview-redis, app.kubernetes.io/instance: {{ .Release.Name }} } }
spec:
  serviceName: {{ .Release.Name }}-redis-master
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: graphview-redis, app.kubernetes.io/instance: {{ .Release.Name }} } }
  template:
    metadata: { labels: { app.kubernetes.io/name: graphview-redis, app.kubernetes.io/part-of: graphview, app.kubernetes.io/instance: {{ .Release.Name }} } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          command: [/bin/sh, -ec]
          args: ['exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass "$REDIS_PASSWORD"']
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.redis.auth.existingSecret }}, key: {{ .Values.redis.auth.passwordKey }} } }
          ports: [{ name: redis, containerPort: 6379 }]
          securityContext: { runAsNonRoot: true, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "2", memory: 4Gi } }
          readinessProbe: { exec: { command: [/bin/sh, -ec, 'redis-cli -a "$REDIS_PASSWORD" ping | grep PONG'] }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { exec: { command: [/bin/sh, -ec, 'redis-cli -a "$REDIS_PASSWORD" ping | grep PONG'] }, initialDelaySeconds: 20, periodSeconds: 20 }
          volumeMounts: [{ name: data, mountPath: /data }, { name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.redis.persistence.storageClassName }}
        storageClassName: {{ .Values.redis.persistence.storageClassName | quote }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.redis.persistence.size | quote }} } }
{{- end }}
