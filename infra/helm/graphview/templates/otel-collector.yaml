apiVersion: v1
kind: ConfigMap
metadata: { name: {{ .Release.Name }}-otel-collector }
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
    processors:
      memory_limiter: { check_interval: 1s, limit_mib: 384 }
      batch: {}
    exporters:
      debug: { verbosity: basic }
    service:
      pipelines:
        traces: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [debug] }
        metrics: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [debug] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ .Release.Name }}-otel-collector }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: graphview-otel-collector } }
  template:
    metadata: { labels: { app.kubernetes.io/name: graphview-otel-collector, app.kubernetes.io/part-of: graphview } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.153.0
          args: [--config=/etc/otel/config.yaml]
          ports: [{ name: otlp-grpc, containerPort: 4317 }, { name: otlp-http, containerPort: 4318 }]
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 512Mi } }
          securityContext: { runAsNonRoot: true, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: config, mountPath: /etc/otel, readOnly: true }]
      volumes: [{ name: config, configMap: { name: {{ .Release.Name }}-otel-collector } }]
---
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-otel-collector }
spec:
  selector: { app.kubernetes.io/name: graphview-otel-collector }
  ports: [{ name: otlp-grpc, port: 4317 }, { name: otlp-http, port: 4318 }]
