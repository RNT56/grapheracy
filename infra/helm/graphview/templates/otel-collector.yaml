apiVersion: v1
kind: ConfigMap
metadata: { name: {{ .Release.Name }}-otel-collector }
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
    processors:
      memory_limiter: { check_interval: 1s, limit_mib: 384 }
      batch: {}
    exporters:
      debug: { verbosity: basic }
      file/traces: { path: /var/lib/otel/traces.json, rotation: { max_megabytes: 20, max_days: 3, max_backups: 3 } }
      file/metrics: { path: /var/lib/otel/metrics.json, rotation: { max_megabytes: 20, max_days: 3, max_backups: 3 } }
      prometheus: { endpoint: 0.0.0.0:8889 }
    extensions:
      health_check: { endpoint: 0.0.0.0:13133 }
    service:
      extensions: [health_check]
      pipelines:
        traces: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [file/traces, debug] }
        metrics: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [prometheus, file/metrics, debug] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ .Release.Name }}-otel-collector }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: graphview-otel-collector, app.kubernetes.io/instance: {{ .Release.Name }} } }
  template:
    metadata: { labels: { app.kubernetes.io/name: graphview-otel-collector, app.kubernetes.io/part-of: graphview, app.kubernetes.io/instance: {{ .Release.Name }} } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, fsGroupChangePolicy: OnRootMismatch, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: collector
          image: {{ .Values.image.otel | quote }}
          args: [--config=/etc/otel/config.yaml]
          ports: [{ name: otlp-grpc, containerPort: 4317 }, { name: otlp-http, containerPort: 4318 }, { name: prometheus, containerPort: 8889 }, { name: health, containerPort: 13133 }]
          readinessProbe: { httpGet: { path: /, port: health }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /, port: health }, initialDelaySeconds: 15, periodSeconds: 20 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 512Mi } }
          securityContext: { runAsNonRoot: true, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: config, mountPath: /etc/otel, readOnly: true }, { name: data, mountPath: /var/lib/otel }]
      volumes: [{ name: config, configMap: { name: {{ .Release.Name }}-otel-collector } }, { name: data, emptyDir: { sizeLimit: 1Gi } }]
---
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-otel-collector }
spec:
  selector: { app.kubernetes.io/name: graphview-otel-collector, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: otlp-grpc, port: 4317 }, { name: otlp-http, port: 4318 }, { name: prometheus, port: 8889 }]
