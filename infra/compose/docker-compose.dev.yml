name: graphview-dev

services:
  web:
    image: node:24-slim
    working_dir: /workspace
    command: sh -lc "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @graphview/web dev --host 0.0.0.0"
    environment:
      GRAPHVIEW_PUBLIC_BASE_URL: http://localhost:5173
      VITE_GRAPHVIEW_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ../..:/workspace
    depends_on:
      - api

  api:
    image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
    working_dir: /workspace/services/api
    command: sh -lc "PYTHONPATH=src uv run uvicorn graphview_api.main:app --host 0.0.0.0 --port 8000"
    environment:
      GRAPHVIEW_ENV: local
      GRAPHVIEW_DATABASE_URL: postgresql+psycopg://graphview:graphview-local-only@postgres:5432/graphview
      ARQ_REDIS_URL: redis://redis:6379/0
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: graphview
      POSTGRES_USER: graphview
      POSTGRES_PASSWORD: graphview-local-only
      MINIO_ENDPOINT: http://minio:9000
      GRAPHVIEW_OBJECT_STORE_PROVIDER: s3
      GRAPHVIEW_S3_ENDPOINT_URL: http://minio:9000
      GRAPHVIEW_S3_ACCESS_KEY_ID: graphview
      GRAPHVIEW_S3_SECRET_ACCESS_KEY: graphview-local-only
    ports:
      - "8000:8000"
    volumes:
      - ../..:/workspace
    depends_on:
      - postgres
      - minio

  worker:
    image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
    working_dir: /workspace/services/worker
    command: sh -lc "PYTHONPATH=src uv run python -m graphview_worker"
    environment:
      GRAPHVIEW_ENV: local
      GRAPHVIEW_DATABASE_URL: postgresql+psycopg://graphview:graphview-local-only@postgres:5432/graphview
      POSTGRES_HOST: postgres
      ARQ_REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      GRAPHVIEW_OBJECT_STORE_PROVIDER: s3
      GRAPHVIEW_S3_ENDPOINT_URL: http://minio:9000
      GRAPHVIEW_S3_ACCESS_KEY_ID: graphview
      GRAPHVIEW_S3_SECRET_ACCESS_KEY: graphview-local-only
    volumes:
      - ../..:/workspace
    depends_on:
      - postgres
      - redis
      - minio

  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: graphview
      POSTGRES_USER: graphview
      POSTGRES_PASSWORD: graphview-local-only
    ports:
      - "5432:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: graphview
      MINIO_ROOT_PASSWORD: graphview-local-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./.data/minio:/data
