[project]
name = "graphview-workspace"
version = "1.0.0"
description = "Python workspace metadata for Graphview services."
requires-python = ">=3.14"
dependencies = []

[tool.uv.workspace]
members = ["services/api", "services/worker"]

[dependency-groups]
dev = [
  "ruff>=0.15.21,<0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["services/api/tests", "services/worker/tests"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning"
]
