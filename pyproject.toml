[project]
name = "graphview-workspace"
version = "0.0.0"
description = "Python workspace metadata for Graphview services."
requires-python = ">=3.14"
dependencies = []

[tool.uv.workspace]
members = ["services/api", "services/worker"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["services/api/tests", "services/worker/tests"]
